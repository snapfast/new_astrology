<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Pinyon+Script&amp;display=swap');
      .s1-title { font-family: 'Pinyon Script', cursive; font-size: 130px; }
      .s1-sub { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 8px; font-weight: 600; }
    </style>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#121212" rx="24"/>
  <circle cx="300" cy="140" r="95" fill="none" stroke="url(#gold1)" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 6" />
  <text x="300" y="165" fill="url(#gold1)" text-anchor="middle" class="s1-title" filter="url(#shadow1)">Bali</text>
  <text x="300" y="230" fill="#D4AF37" text-anchor="middle" class="s1-sub" opacity="0.85">ELEGANT CURSIVE</text>
</svg>