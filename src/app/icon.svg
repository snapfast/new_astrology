<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Solar Radiance Gradient (Material 3 tonal palette + Fluent luminous elevation) -->
    <linearGradient id="baliFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="50%" stop-color="#FF5900"/>
      <stop offset="100%" stop-color="#D13400"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="32%" cy="22%" r="75%">
      <stop offset="0%" stop-color="#FFB700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5900" stop-opacity="0"/>
    </radialGradient>
    <!-- Elevation shadow (Google Material / Apple squircle depth) -->
    <filter id="baliFaviconShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#420C00" flood-opacity="0.40"/>
    </filter>
    <!-- Celestial Gold Spark Gradient -->
    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6"/>
      <stop offset="40%" stop-color="#FFC900"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle Background (Apple continuous curvature r=116 on 480) -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#baliFaviconGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sunGlow)"/>

  <!-- Specular inner highlight rim (Apple HIG / Microsoft Fluent subtle glass edge) -->
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Iconic Vedic 'B' Monogram & Jyotish Celestial Star Lockup -->
  <g filter="url(#baliFaviconShadow)">
    <!-- Optically Mastered Monogram 'B' -->
    <path fill="#FFFFFF" fill-rule="evenodd" clip-rule="evenodd" d="
      M 132 96
      H 264
      C 328 96 376 135 376 192
      C 376 228 354 259 322 273
      C 366 287 396 323 396 370
      C 396 430 346 472 278 472
      H 132
      C 114.3 472 100 457.7 100 440
      V 128
      C 100 110.3 114.3 96 132 96
      Z
      M 172 158
      V 246
      H 256
      C 285 246 308 225 308 202
      C 308 179 285 158 256 158
      H 172
      Z
      M 172 310
      V 410
      H 270
      C 303 410 330 385 330 360
      C 330 335 303 310 270 310
      H 172
      Z
    "/>

    <!-- Radiant 8-Pointed Jyotish Star (Ashtalakshmi / Navagraha Cosmic Light) -->
    <!-- Primary Cardinal Rays -->
    <path fill="url(#goldStarGrad)" d="
      M 406 92
      C 406 116 418 128 442 128
      C 418 128 406 140 406 164
      C 406 140 394 128 370 128
      C 394 128 406 116 406 92
      Z
    "/>
    <!-- Secondary Intercardinal Rays -->
    <path fill="url(#goldStarGrad)" opacity="0.9" d="
      M 406 110
      C 414 119 419 124 428 128
      C 419 132 414 137 406 146
      C 398 137 393 132 384 128
      C 393 124 398 119 406 110
      Z
    "/>
    <!-- Core Solar Bindu -->
    <circle cx="406" cy="128" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
